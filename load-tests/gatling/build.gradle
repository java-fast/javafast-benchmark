plugins {
    id 'java'
    id 'io.gatling.gradle' version '3.15.1.3'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Forward -Dbenchmark.url supplied to Gradle into the forked Gatling JVM.
tasks.withType(JavaExec).configureEach {
    systemProperty 'benchmark.url', System.getProperty('benchmark.url', 'http://127.0.0.1:8080')
}
