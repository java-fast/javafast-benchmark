plugins {
    id 'base'
    id 'io.javafast.benchmark.report'
}

allprojects {
    group = 'io.javafast.benchmark'
    version = '1.0-SNAPSHOT'

    repositories {
        mavenLocal()
        mavenCentral()
    }
}

subprojects {
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 25
    }
}
